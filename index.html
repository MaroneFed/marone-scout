<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#12101A">
<title>Marone Scout</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<style>
:root{--bg:#12101A;--surface:#1C1926;--surface-2:#252132;--line:#332E44;--text:#EDEAF5;
--muted:#8E88A3;--gold:#E8C46A;--warn:#D9414A;--ok:#34A85A;--tab-h:58px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;
padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));overscroll-behavior-y:contain}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:var(--bg);
padding:calc(env(safe-area-inset-top) + 9px) 13px 9px;border-bottom:1px solid var(--line)}
.brandline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:600}
.brand b{color:var(--gold)}
.rsel{display:flex;align-items:center;gap:6px}
.rsel select{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:13px;font-weight:700}
.sync{background:var(--surface);border:1px solid var(--line);border-radius:999px;width:34px;height:32px;color:var(--gold);font-size:16px}
.sync.busy{opacity:.4}
.searchwrap{position:relative;margin-top:9px}
#q{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;
padding:13px 40px 13px 13px;font-size:17px;font-weight:500}
#q::placeholder{color:var(--muted);font-weight:400}
.clear{position:absolute;right:4px;top:4px;bottom:4px;width:36px;color:var(--muted);font-size:19px;border-radius:10px}
main{padding:13px}
.view{display:none}.view.on{display:block}
h2{font-size:19px;margin:0 0 2px;font-weight:700}
.dim{color:var(--muted);font-size:13px;margin:0 0 12px;line-height:1.5}
.sub{color:var(--muted);font-size:13px}
.empty{color:var(--muted);text-align:center;padding:40px 18px;font-size:15px;line-height:1.55}
.empty strong{color:var(--text);display:block;font-size:17px;margin-bottom:6px;font-weight:600}
.friend{background:var(--surface);border:1px solid var(--gold);border-radius:13px;padding:12px 13px;margin-bottom:12px}
.friend .lab{font-size:11px;letter-spacing:.1em;color:var(--gold);font-weight:700;margin-bottom:5px}
.friend .big{font-size:18px;font-weight:700}
.answer{border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:11px;background:var(--surface)}
.answer .who{padding:11px 13px 9px;font-size:18px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:9px}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:5px;flex:none}
.tag.sure{background:var(--gold);color:#1A1508}
.tag.maybe{color:var(--gold);border:1px solid var(--gold)}
.tag.none{color:var(--muted);border:1px solid var(--line)}
.deckband{display:flex;align-items:center;gap:10px;padding:11px 13px;border-top:1px solid var(--line)}
.swatch{display:flex;width:32px;height:32px;border-radius:9px;overflow:hidden;flex:none}
.swatch i{flex:1}
.deckband .txt{font-size:16px;font-weight:600}
.orsep{padding:5px 13px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);background:var(--surface-2)}
.trace{padding:9px 13px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);line-height:1.5}
.star{font-size:13px;color:var(--gold);border:1px solid var(--line);border-radius:8px;padding:7px 11px;margin:9px 13px 12px;display:inline-block}
.row{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);
border-radius:11px;margin-bottom:7px;overflow:hidden;width:100%;text-align:left}
.row:active{background:var(--surface-2)}
.row.done{border-color:#2E5A3A}
.bars{display:flex;flex-direction:column;width:8px;flex:none}
.bars i{flex:1}
.rowbody{padding:10px 11px;flex:1;min-width:0}
.name{font-size:15.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inks{font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnum{font-variant-numeric:tabular-nums;font-weight:700;color:var(--gold);font-size:13px;
padding:10px 0 0 11px;flex:none;width:46px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.add{display:block;width:100%;background:var(--gold);color:#1A1508;font-weight:700;
border-radius:11px;padding:14px;font-size:16px;margin:3px 0 12px}
.add:active{filter:brightness(.9)}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:10px}
.slot h3{margin:0;font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.06em}
.slot .who2{font-size:15.5px;font-weight:600;margin:2px 0 9px;
overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 5px}
.field{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
padding:11px;font-size:16px;margin-bottom:11px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:0 0 9px}
.ink{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 3px;border-radius:9px;
background:var(--surface-2);border:1.5px solid var(--line);font-weight:600;font-size:12.5px}
.ink .sq{width:20px;height:20px;border-radius:6px}
.ink[aria-pressed="true"]{border-color:currentColor}
.ink[aria-pressed="true"] .sq{box-shadow:0 0 0 3px rgba(255,255,255,.16)}
.actions{display:flex;gap:7px;margin-top:5px}
.btn{flex:1;padding:13px;border-radius:11px;font-weight:700;font-size:15.5px;text-align:center;
background:var(--surface-2);border:1px solid var(--line)}
.btn.primary{background:var(--gold);color:#1A1508;border-color:var(--gold)}
.btn.danger{color:var(--warn);background:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:12px}
.card h3{margin:0 0 9px;font-size:14.5px;font-weight:700}
.stat{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border:0}
.stat .lbl{flex:1;font-size:14.5px;display:flex;align-items:center;gap:7px;min-width:0}
.stat .n{font-variant-numeric:tabular-nums;font-weight:700}
.bar{height:5px;border-radius:99px;background:var(--surface-2);width:64px;overflow:hidden;flex:none}
.bar i{display:block;height:100%}
.filters{display:flex;gap:6px;overflow-x:auto;margin:0 -13px 9px;padding:0 13px 7px}
.chip{flex:none;padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);
font-size:13.5px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.prog{height:4px;background:var(--surface-2);border-radius:9px;overflow:hidden;margin:0 0 12px}
.prog i{display:block;height:100%;background:var(--ok);transition:width .2s}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);
border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;height:var(--tab-h);font-size:12px;font-weight:600;color:var(--muted);
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button[aria-current="true"]{color:var(--gold)}
nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 16px);
background:var(--surface-2);border:1px solid var(--line);padding:10px 17px;border-radius:999px;
font-size:14px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .18s;max-width:88vw;text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brandline">
    <div class="brand">MARONE <b>SCOUT</b></div>
    <div class="rsel">
      <select id="rSel" aria-label="Ronde"></select>
      <button class="sync" id="bSync" aria-label="Actualiser les appariements">&#8635;</button>
    </div>
  </div>
  <div class="searchwrap">
    <input id="q" type="search" placeholder="Chercher un joueur ou une table" autocomplete="off"
      autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
    <button class="clear" id="clearQ" aria-label="Effacer">&times;</button>
  </div>
</header>

<main>
  <section id="v-scout" class="view on">
    <div id="friendBox"></div>
    <div id="results"></div>
  </section>

  <section id="v-tables" class="view">
    <h2 id="tTitle">Tables</h2>
    <p class="dim" id="tCount"></p>
    <div class="prog"><i id="tProg" style="width:0%"></i></div>
    <div class="filters" id="tFilters"></div>
    <button class="add" id="bNext">Aller a la premiere table vide</button>
    <div id="tableList"></div>
  </section>

  <section id="v-edit" class="view">
    <h2 id="eTitle">Table</h2>
    <p class="dim" id="eSub"></p>

    <div class="slot">
      <h3>PREMIER DECK VU</h3>
      <div class="who2" id="eN1">Joueur A</div>
      <div class="grid" data-slot="0"></div>
      <div id="eOwnWrap0"></div>
    </div>
    <div class="slot">
      <h3>SECOND DECK VU</h3>
      <div class="who2" id="eN2">Joueur B</div>
      <div class="grid" data-slot="1"></div>
      <div id="eOwnWrap1"></div>
    </div>
    <p class="sub" id="eHint" style="margin:-2px 0 12px"></p>

    <div class="actions">
      <button class="btn primary" id="eNextSave">Enregistrer et suivante</button>
    </div>
    <div class="actions">
      <button class="btn" id="eSave">Enregistrer</button>
      <button class="btn" id="eCancel">Retour</button>
    </div>
    <div class="actions">
      <button class="btn danger" id="eClear">Effacer cette table</button>
    </div>
  </section>

  <section id="v-players" class="view">
    <div class="filters" id="pFilters"></div>
    <div id="playerList"></div>
  </section>

  <section id="v-meta" class="view">
    <div class="card"><h3>Encres du field</h3><div id="inkStats"></div></div>
    <div class="card"><h3>Decks identifies</h3><div id="pairStats"></div></div>
    <div class="card">
      <h3>Tournoi</h3>
      <label for="evId">Numero de l'evenement</label>
      <input id="evId" class="field" inputmode="numeric">
      <div class="actions"><button class="btn primary" id="bLoadEv">Charger ce tournoi</button></div>
      <p class="sub" id="evInfo" style="margin:10px 0 0"></p>
    </div>
    <div class="card">
      <h3>Sauvegarde</h3>
      <div class="actions">
        <button class="btn" id="doExport">Copier</button>
        <button class="btn" id="doImport">Restaurer</button>
      </div>
      <div class="actions"><button class="btn danger" id="doReset">Effacer mes observations</button></div>
    </div>
  </section>
</main>

<nav>
  <button data-go="scout" aria-current="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Scout</button>
  <button data-go="tables"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M12 10v10"/></svg>Tables</button>
  <button data-go="players"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Joueurs</button>
  <button data-go="meta"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Meta</button>
</nav>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

var INKS=[{k:"amber",n:"Ambre",c:"#E8A33D"},{k:"amethyst",n:"Amethyste",c:"#9B5FD0"},
{k:"emerald",n:"Emeraude",c:"#34A85A"},{k:"ruby",n:"Rubis",c:"#D9414A"},
{k:"sapphire",n:"Saphir",c:"#3E8FD9"},{k:"steel",n:"Acier",c:"#97A3B5"}];
var INK={};INKS.forEach(function(i){INK[i.k]=i;});

var KEY="marone-scout-v3";
var API="https://api.cloudflare.ravensburgerplay.com/hydraproxy/api/v2";
var PROXIES=[
  function(u){return {url:"https://r.jina.ai/"+u,opt:{headers:{"x-respond-with":"text"}}};},
  function(u){return {url:"https://api.allorigins.win/raw?url="+encodeURIComponent(u),opt:{}};},
  function(u){return {url:"https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(u),opt:{}};}
];

var db={ev:"924487",ami:"",cur:null,rounds:[],obs:{},regs:[]};
var S=null,draft=null,view="scout",pFilter=null,tFilter=null,busy=false;

/* ---------- utilitaires ---------- */
function esc(s){return String(s===null||s===undefined?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function norm(s){return (s||"").toString().trim().toLowerCase().normalize("NFD")
  .split("").filter(function(c){var n=c.charCodeAt(0);return n<768||n>879;}).join("")
  .replace(/[^a-z0-9]/g,"");}
function dk(a){return a.slice().sort().join("+");}
function dn(k){return k.split("+").map(function(x){return INK[x]?INK[x].n:x;}).join(" / ");}
function di(k){return k.split("+");}
function uniq(a){return a.filter(function(x,i){return a.indexOf(x)===i;});}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("on");
  clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("on");},2400);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){toast("Sauvegarde impossible");}}
function load(){try{var r=localStorage.getItem(KEY);if(r){var p=JSON.parse(r);
  if(p&&p.obs){db=p;db.rounds=db.rounds||[];db.obs=db.obs||{};db.regs=db.regs||[];db.ev=db.ev||"924487";}}}catch(e){}}
function obsKey(num,t){return num+":"+t;}
function getObs(num,t){return db.obs[obsKey(num,t)]||null;}
function nDecks(o){return o?(o.d||[]).filter(function(d){return d&&d.length;}).length:0;}
function curRound(){
  if(!db.rounds.length) return null;
  var f=db.rounds.filter(function(r){return r.num===db.cur;});
  return f[0]||db.rounds[db.rounds.length-1];
}

/* ---------- reseau ---------- */
async function apiGet(path){
  var full=API+path,last=null;
  for(var i=0;i<PROXIES.length;i++){
    var p=PROXIES[i](full);
    try{
      var c=new AbortController();
      var id=setTimeout(function(){c.abort();},15000);
      var r=await fetch(p.url,Object.assign({signal:c.signal},p.opt));
      var t=await r.text();
      clearTimeout(id);
      var j=JSON.parse(t);
      if(j&&j.error){last="reponse "+j.status;continue;}
      return j;
    }catch(e){last=e.name+" "+(e.message||"");}
  }
  throw new Error(last||"echec reseau");
}
async function syncEvent(){
  var e=await apiGet("/events/"+db.ev+"/");
  var rs=[];
  (e.tournament_phases||[]).forEach(function(p){
    (p.rounds||[]).forEach(function(r){
      rs.push({id:r.id,num:r.round_number,status:r.status,pstatus:r.pairings_status,tables:null});
    });
  });
  rs.sort(function(a,b){return a.num-b.num;});
  rs.forEach(function(nr){
    var old=db.rounds.filter(function(o){return o.id===nr.id;})[0];
    if(old&&old.tables) nr.tables=old.tables;
  });
  db.rounds=rs;
  db.evName=e.name||"";
  db.evPlayers=e.registered_user_count||0;
  return rs;
}
async function syncPlayers(){
  var j=await apiGet("/events/"+db.ev+"/registrations/?page=1&page_size=500");
  var noms=(j.results||[]).map(function(r){
    return r.best_identifier||(r.user&&r.user.best_identifier)||"";}).filter(Boolean);
  if(noms.length) db.regs=noms;
  return noms;
}
async function syncRound(round){
  var m=await apiGet("/tournament-rounds/"+round.id+"/matches/paginated/?page_size=500");
  var tabs=[];
  (m.results||[]).forEach(function(x){
    var ps=(x.player_match_relationships||[]).map(function(p){
      var u=p.user_event_status||{};
      return u.best_identifier||(p.player&&p.player.best_identifier)||"";
    }).filter(Boolean);
    if(!ps.length) return;
    tabs.push({t:x.table_number,p1:ps[0]||"",p2:ps[1]||"",bye:!!x.match_is_bye||ps.length<2});
  });
  tabs.sort(function(a,b){return (a.t<0?99999:a.t)-(b.t<0?99999:b.t);});
  round.tables=tabs;
  return tabs;
}

/* ---------- solveur ----------
   Le deck d'un joueur est fixe sur tout le tournoi.
   Table a 2 decks observes : {deck(A),deck(B)} = exactement ce multiset.
   Table a 1 deck observe   : au moins un des deux joue ce deck.
   Deck confirme a un joueur : contrainte directe.
   On intersecte, puis on propage jusqu'a stabilite.                    */
function solve(){
  var cand={},names={},seen={},why={},conf=[],rows=[];
  function reg(raw){
    if(!raw) return null;
    var id=norm(raw); if(!id) return null;
    if(!names[id]) names[id]=String(raw).trim();
    if(!seen[id]) seen[id]=[];
    return id;
  }
  function restrict(id,set,w){
    if(!id) return false;
    var before=cand[id]?cand[id].length:-1;
    if(!cand[id]) cand[id]=set.slice();
    else{
      var nx=cand[id].filter(function(d){return set.indexOf(d)>=0;});
      if(!nx.length){ if(conf.indexOf(id)<0) conf.push(id); return false; }
      cand[id]=nx;
    }
    if(w){why[id]=why[id]||[];if(why[id].indexOf(w)<0)why[id].push(w);}
    return cand[id].length!==before;
  }

  (db.regs||[]).forEach(reg);

  db.rounds.forEach(function(r){
    (r.tables||[]).forEach(function(tb){
      var a=reg(tb.p1),b=tb.bye?null:reg(tb.p2);
      var lab="R"+r.num+" T"+(tb.t>0?tb.t:"bye");
      if(a) seen[a].push(lab);
      if(b) seen[b].push(lab);
      var o=getObs(r.num,tb.t);
      var decks=o?(o.d||[]).filter(function(d){return d&&d.length;}).map(dk):[];
      rows.push({a:a,b:b,decks:decks,own:o?(o.o||[null,null]):[null,null],lab:lab,raw:o});
    });
  });

  rows.forEach(function(r){
    if(r.raw&&r.raw.d) r.raw.d.forEach(function(d,i){
      if(!d||!d.length) return;
      var o=r.own[i],id=o==="p1"?r.a:o==="p2"?r.b:null;
      if(id) restrict(id,[dk(d)],"confirme en "+r.lab);
    });
    if(r.decks.length===2&&r.a&&r.b){
      var u=uniq(r.decks);
      restrict(r.a,u,"vu en "+r.lab);
      restrict(r.b,u,"vu en "+r.lab);
    }else if(r.decks.length>=1&&!r.b&&r.a){
      restrict(r.a,[r.decks[0]],"vu en "+r.lab);
    }
  });

  for(var pass=0;pass<80;pass++){
    var moved=false;
    rows.forEach(function(r){
      if(!r.a||!r.b) return;
      if(r.decks.length===2){
        var d1=r.decks[0],d2=r.decks[1];
        [[r.a,r.b],[r.b,r.a]].forEach(function(pp){
          var me=pp[0],ot=pp[1];
          if(cand[me]&&cand[me].length===1){
            var mine=cand[me][0];
            var rest=(d1===d2)?d1:(mine===d1?d2:(mine===d2?d1:null));
            if(rest===null) return;
            if(restrict(ot,[rest],"deduit par elimination en "+r.lab)) moved=true;
          }
        });
      }else if(r.decks.length===1){
        var x=r.decks[0];
        [[r.a,r.b],[r.b,r.a]].forEach(function(pp){
          var me=pp[0],ot=pp[1];
          if(cand[me]&&cand[me].indexOf(x)<0){
            if(restrict(ot,[x],"seul possible en "+r.lab)) moved=true;
          }
        });
      }
    });
    if(!moved) break;
  }

  var susp={};
  if(conf.length) rows.forEach(function(r){
    if(!r.a||!r.b) return;
    if(conf.indexOf(r.a)>=0) susp[r.b]=1;
    if(conf.indexOf(r.b)>=0) susp[r.a]=1;
  });

  var out=Object.keys(names).map(function(id){
    return {id:id,name:names[id],decks:cand[id]||null,seen:seen[id],
            why:why[id]||[],conflict:conf.indexOf(id)>=0,
            suspect:!!susp[id]&&conf.indexOf(id)<0};
  });
  out.sort(function(a,b){return a.name.localeCompare(b.name,"fr",{sensitivity:"base"});});
  return out;
}
function refresh(){S=solve();}
function byName(n){var k=norm(n);var f=S.filter(function(p){return p.id===k;});return f[0]||null;}
function tableOf(name,round){
  var k=norm(name),r=round||curRound();
  if(!r||!r.tables) return null;
  var f=r.tables.filter(function(t){return norm(t.p1)===k||norm(t.p2)===k;});
  return f[0]||null;
}

/* ---------- rendu ---------- */
function swatch(k){return '<span class="swatch">'+di(k).map(function(x){
  return '<i style="background:'+(INK[x]?INK[x].c:"#332E44")+'"></i>';}).join("")+'</span>';}
function statusOf(p){
  if(p.conflict) return {t:"none",x:"contradiction"};
  if(!p.decks) return {t:"none",x:"inconnu"};
  if(p.suspect) return {t:"maybe",x:"a verifier"};
  if(p.decks.length===1) return {t:"sure",x:"certain"};
  return {t:"maybe",x:p.decks.length+" possibilites"};
}
function answerCard(p){
  var st=statusOf(p);
  var h='<div class="answer"><div class="who"><span>'+esc(p.name)+
    '</span><span class="tag '+st.t+'">'+st.x+'</span></div>';
  var tb=tableOf(p.name);
  if(tb) h+='<div class="trace" style="color:var(--gold)">Cette ronde : table '+
    (tb.t>0?tb.t:"bye")+(tb.bye?"":" contre "+esc(norm(tb.p1)===p.id?tb.p2:tb.p1))+'</div>';
  if(p.conflict)
    h+='<div class="trace" style="color:#FFC9CC">Observations contradictoires. Verifie '+esc(p.seen.join(", "))+'.</div>';
  else if(!p.decks)
    h+='<div class="trace">Aucun deck encode'+(p.seen.length?' sur ses tables ('+esc(p.seen.join(", "))+')':", pas encore appareille")+'.</div>';
  else{
    p.decks.forEach(function(d,i){
      if(i) h+='<div class="orsep">ou</div>';
      h+='<div class="deckband">'+swatch(d)+'<span class="txt">'+dn(d)+'</span></div>';
    });
    h+='<div class="trace">'+esc(p.why.length?p.why.slice(0,3).join(" / "):"Vu a "+p.seen.join(", "))+'</div>';
  }
  h+='<button class="star" data-star="'+esc(p.name)+'">'+
    (norm(db.ami)===p.id?"Ne plus suivre":"Suivre ce joueur")+'</button>';
  return h+'</div>';
}
function renderFriend(){
  var box=document.getElementById("friendBox");
  if(!db.ami){box.innerHTML="";return;}
  var tb=tableOf(db.ami);
  var h='<div class="friend"><div class="lab">JOUEUR SUIVI</div><div class="big">'+esc(db.ami)+'</div>';
  if(!tb) h+='<div class="sub" style="margin-top:5px">Pas d appariement charge pour cette ronde.</div>';
  else if(tb.bye) h+='<div class="sub" style="margin-top:5px">Bye cette ronde.</div>';
  else{
    var adv=norm(tb.p1)===norm(db.ami)?tb.p2:tb.p1,ap=byName(adv);
    h+='<div style="margin-top:6px;font-size:14px">Table '+tb.t+' contre <b>'+esc(adv)+'</b></div>';
    if(ap&&ap.decks&&ap.decks.length===1)
      h+='<div class="deckband" style="padding:10px 0 0;border:0">'+swatch(ap.decks[0])+
         '<span class="txt">'+dn(ap.decks[0])+'</span><span class="tag sure">certain</span></div>';
    else if(ap&&ap.decks)
      h+='<div style="margin-top:7px;font-size:14.5px;color:var(--gold)">'+
         esc(ap.decks.map(dn).join("   ou   "))+'</div>';
    else h+='<div class="sub" style="margin-top:6px">Deck inconnu. Va voir la table '+tb.t+'.</div>';
  }
  box.innerHTML=h+'</div>';
}
function renderScout(){
  renderFriend();
  var raw=document.getElementById("q").value.trim();
  var out=document.getElementById("results"),n=norm(raw);
  if(/^[0-9]+$/.test(raw)){
    var r=curRound();
    var tb=r&&r.tables?r.tables.filter(function(x){return String(x.t)===raw;})[0]:null;
    if(tb){
      out.innerHTML='<p class="sub" style="margin:2px 0 9px">Ronde '+r.num+', table '+esc(raw)+'</p>'+
        [tb.p1,tb.p2].filter(Boolean).map(function(nm){
          var p=byName(nm);
          return p?answerCard(p):'<div class="answer"><div class="who"><span>'+esc(nm)+'</span></div></div>';
        }).join("")+
        '<button class="add" data-t="'+tb.t+'">Encoder cette table</button>';
      return;
    }
  }
  if(!n){
    var r2=curRound();
    var vus=Object.keys(db.obs).length;
    if(!r2||!r2.tables){
      out.innerHTML='<div class="empty"><strong>'+
        ((db.regs&&db.regs.length)?db.regs.length+" joueurs inscrits":"Aucune donnee chargee")+
        '</strong>Appuie sur le bouton rond en haut a droite pour recuperer les inscrits et les tables.</div>';
      return;
    }
    out.innerHTML='<div class="empty"><strong>Ronde '+r2.num+' : '+r2.tables.length+' tables</strong>'+
      vus+' table'+(vus>1?"s":"")+' encodee'+(vus>1?"s":"")+' au total. Tape un pseudo, ou un numero de table.</div>';
    return;
  }
  var hits=S.filter(function(p){return norm(p.name).indexOf(n)>=0;})
    .sort(function(a,b){return norm(a.name).indexOf(n)-norm(b.name).indexOf(n);}).slice(0,8);
  out.innerHTML=hits.length?hits.map(function(p){return answerCard(p);}).join("")
    :'<div class="empty"><strong>Aucun joueur</strong>Ce pseudo n apparait ni dans les inscrits ni dans les tables chargees.</div>';
}
function tRow(tb,r){
  var o=getObs(r.num,tb.t),ds=o?(o.d||[]).filter(function(d){return d&&d.length;}):[];
  var bars=ds.length?ds.map(function(d){return di(dk(d)).map(function(k){
      return '<i style="background:'+INK[k].c+'"></i>';}).join("");}).join("")
    :'<i style="background:#332E44"></i>';
  var sub=ds.length?ds.map(function(d){return dn(dk(d));}).join("     ")
    :(tb.bye?"bye":"a encoder");
  return '<button class="row'+(ds.length===2?" done":"")+'" data-t="'+tb.t+'">'+
    '<span class="bars">'+bars+'</span><span class="tnum">'+(tb.t>0?"T"+tb.t:"--")+'</span>'+
    '<span class="rowbody"><span class="name">'+esc(tb.p1)+(tb.bye?"":"   vs   "+esc(tb.p2))+'</span>'+
    '<span class="inks">'+esc(sub)+'</span></span></button>';
}
function renderTables(){
  var r=curRound();
  document.getElementById("tTitle").textContent=r?("Ronde "+r.num):"Tables";
  var list=document.getElementById("tableList");
  if(!r||!r.tables){
    document.getElementById("tCount").textContent="";
    document.getElementById("tProg").style.width="0%";
    document.getElementById("tFilters").innerHTML="";
    list.innerHTML='<div class="empty"><strong>Rien de charge</strong>Bouton rond en haut a droite pour recuperer les appariements.</div>';
    return;
  }
  var jou=r.tables.filter(function(t){return !t.bye;});
  var faites=jou.filter(function(t){return nDecks(getObs(r.num,t.t))===2;}).length;
  document.getElementById("tCount").textContent=faites+" / "+jou.length+" tables encodees";
  document.getElementById("tProg").style.width=(jou.length?Math.round(faites/jou.length*100):0)+"%";
  document.getElementById("tFilters").innerHTML=
    '<button class="chip" data-tf="" aria-pressed="'+(!tFilter)+'">Toutes '+r.tables.length+'</button>'+
    '<button class="chip" data-tf="todo" aria-pressed="'+(tFilter==="todo")+'">A faire '+(jou.length-faites)+'</button>'+
    '<button class="chip" data-tf="done" aria-pressed="'+(tFilter==="done")+'">Faites '+faites+'</button>';
  var arr=r.tables.filter(function(t){
    var k=nDecks(getObs(r.num,t.t));
    if(tFilter==="todo") return !t.bye&&k<2;
    if(tFilter==="done") return k===2;
    return true;
  });
  list.innerHTML=arr.length?arr.map(function(t){return tRow(t,r);}).join("")
    :'<div class="empty">Rien dans ce filtre.</div>';
}
function firstEmpty(){
  var r=curRound();
  if(!r||!r.tables) return null;
  var f=r.tables.filter(function(t){return !t.bye&&nDecks(getObs(r.num,t.t))<2;});
  return f[0]||null;
}

/* ---------- edition d'une table ---------- */
function openTable(tnum){
  var r=curRound();
  if(!r||!r.tables) return;
  var tb=r.tables.filter(function(x){return x.t===tnum;})[0];
  if(!tb) return;
  var o=getObs(r.num,tnum);
  draft={num:r.num,t:tnum,p1:tb.p1,p2:tb.p2,bye:tb.bye,
         d:o?JSON.parse(JSON.stringify(o.d||[[],[]])):[[],[]],
         o:o?(o.o||[null,null]).slice():[null,null]};
  if(!draft.d[0]) draft.d[0]=[];
  if(!draft.d[1]) draft.d[1]=[];
  document.getElementById("eTitle").textContent="Table "+(tnum>0?tnum:"bye");
  document.getElementById("eSub").textContent="Ronde "+r.num+(tb.bye?" - bye, rien a encoder":"");
  document.getElementById("eN1").textContent=tb.p1||"Joueur A";
  document.getElementById("eN2").textContent=tb.bye?"(personne en face)":(tb.p2||"Joueur B");
  document.getElementById("eHint").textContent=tb.bye?""
    :"Si tu ne sais pas lequel des deux joue quoi, mets les decks dans n importe quel ordre : l app demelera aux rondes suivantes.";
  paintSlots();paintOwners();
  go("edit");
}
function paintSlots(){
  [0,1].forEach(function(s){
    document.querySelector('.grid[data-slot="'+s+'"]').innerHTML=INKS.map(function(i){
      var on=draft.d[s].indexOf(i.k)>=0;
      return '<button class="ink" data-slot="'+s+'" data-ink="'+i.k+'" aria-pressed="'+on+'" style="color:'+
        (on?i.c:"var(--text)")+'"><span class="sq" style="background:'+
        (on?i.c:"var(--line)")+'"></span>'+i.n+'</button>';
    }).join("");
  });
}
function paintOwners(){
  [0,1].forEach(function(s){
    var w=document.getElementById("eOwnWrap"+s);
    if(draft.bye||!draft.p2||!draft.d[s].length){w.innerHTML="";return;}
    var nom=s===0?draft.p1:draft.p2;
    var cur=draft.o[s];
    w.innerHTML='<div class="actions" style="margin-top:0"><button class="btn'+(cur?" primary":"")+
      '" data-own="'+s+'">'+(cur?"Confirme : c est bien "+esc(nom):"Je sais que c est "+esc(nom))+'</button></div>';
  });
}
function saveDraft(){
  var k=obsKey(draft.num,draft.t);
  if(!nDecks({d:draft.d})) delete db.obs[k];
  else db.obs[k]={d:draft.d,o:draft.o};
  save();refresh();
  var bad=S.filter(function(p){return p.conflict;});
  if(bad.length) toast("Contradiction sur "+bad[0].name+", verifie ses tables");
}

/* ---------- joueurs et meta ---------- */
function renderPlayers(){
  var sure=S.filter(function(p){return p.decks&&p.decks.length===1;}).length;
  document.getElementById("pFilters").innerHTML=
    '<button class="chip" data-pf="" aria-pressed="'+(!pFilter)+'">Tous '+S.length+'</button>'+
    '<button class="chip" data-pf="sure" aria-pressed="'+(pFilter==="sure")+'">Identifies '+sure+'</button>'+
    '<button class="chip" data-pf="open" aria-pressed="'+(pFilter==="open")+'">A confirmer '+(S.length-sure)+'</button>';
  var arr=S.filter(function(p){
    if(pFilter==="sure") return p.decks&&p.decks.length===1;
    if(pFilter==="open") return !p.decks||p.decks.length!==1;
    return true;
  });
  document.getElementById("playerList").innerHTML=arr.length?arr.map(function(p){
    var bars=p.decks&&p.decks.length===1
      ?di(p.decks[0]).map(function(k){return '<i style="background:'+INK[k].c+'"></i>';}).join("")
      :'<i style="background:'+(p.decks?"#E8C46A":"#332E44")+'"></i>';
    var line=!p.decks?"inconnu":p.decks.length===1?dn(p.decks[0]):p.decks.map(dn).join("   ou   ");
    return '<button class="row" data-player="'+esc(p.name)+'"><span class="bars">'+bars+'</span>'+
      '<span class="rowbody"><span class="name">'+esc(p.name)+'</span>'+
      '<span class="inks">'+esc(line)+'</span></span></button>';
  }).join("")
    :'<div class="empty"><strong>Personne</strong>Charge le tournoi pour voir les joueurs.</div>';
}
function renderMeta(){
  var sure=S.filter(function(p){return p.decks&&p.decks.length===1;});
  var c={},tot=0;
  INKS.forEach(function(i){c[i.k]=0;});
  sure.forEach(function(p){di(p.decks[0]).forEach(function(k){if(c[k]!==undefined){c[k]++;tot++;}});});
  var mx=Math.max(1,Math.max.apply(null,INKS.map(function(i){return c[i.k];})));
  document.getElementById("inkStats").innerHTML=tot
    ?INKS.slice().sort(function(a,b){return c[b.k]-c[a.k];}).map(function(i){
      return '<div class="stat"><span class="lbl"><span class="dot" style="background:'+i.c+'"></span>'+
        i.n+'</span><span class="bar"><i style="width:'+Math.round(c[i.k]/mx*100)+'%;background:'+i.c+
        '"></i></span><span class="n">'+c[i.k]+'</span></div>';}).join("")
    :'<p class="sub" style="margin:0">Aucun deck identifie avec certitude.</p>';
  var pk={};
  sure.forEach(function(p){pk[p.decks[0]]=(pk[p.decks[0]]||0)+1;});
  var l=Object.keys(pk).map(function(k){return {k:k,n:pk[k]};})
    .sort(function(a,b){return b.n-a.n;}).slice(0,12);
  document.getElementById("pairStats").innerHTML=l.length?l.map(function(o){
    return '<div class="stat"><span class="lbl">'+swatch(o.k)+
      '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+dn(o.k)+'</span></span>'+
      '<span class="n">'+o.n+'</span></div>';}).join("")
    :'<p class="sub" style="margin:0">Rien a compter.</p>';
  document.getElementById("evId").value=db.ev;
  document.getElementById("evInfo").textContent=db.evName
    ?(db.evName+" - "+db.evPlayers+" inscrits, "+db.rounds.length+" ronde(s) publiee(s)"):"";
}
function renderRoundSelect(){
  var s=document.getElementById("rSel");
  if(!db.rounds.length){s.innerHTML='<option>--</option>';return;}
  var cur=curRound();
  s.innerHTML=db.rounds.map(function(r){
    return '<option value="'+r.num+'"'+(cur&&r.num===cur.num?" selected":"")+'>R'+r.num+'</option>';
  }).join("");
}
function go(v){
  view=v;
  ["scout","tables","edit","players","meta"].forEach(function(k){
    document.getElementById("v-"+k).classList.toggle("on",k===v);});
  var tab=v==="edit"?"tables":v;
  [].forEach.call(document.querySelectorAll("nav button"),function(b){
    b.setAttribute("aria-current",b.dataset.go===tab?"true":"false");});
  if(v==="scout") renderScout();
  if(v==="tables") renderTables();
  if(v==="players") renderPlayers();
  if(v==="meta") renderMeta();
  window.scrollTo(0,0);
}

/* ---------- synchronisation ---------- */
function setBusy(b){
  busy=b;
  document.getElementById("bSync").classList.toggle("busy",b);
}
async function doSync(){
  if(busy) return;
  setBusy(true);
  try{
    try{ await syncPlayers(); }catch(e){}
    var rs=await syncEvent();
    if(!rs.length){
      toast("Aucune ronde publiee. "+(db.regs.length||0)+" inscrits charges.");
    }else{
      var target=null;
      for(var i=rs.length-1;i>=0;i--){
        if(rs[i].pstatus&&rs[i].pstatus!=="UNPUBLISHED"){target=rs[i];break;}
      }
      if(!target) target=rs[rs.length-1];
      if(db.cur){
        var f=rs.filter(function(r){return r.num===db.cur;})[0];
        if(f) target=f;
      }
      await syncRound(target);
      db.cur=target.num;
      toast("Ronde "+target.num+" : "+(target.tables||[]).length+" tables");
    }
    save();refresh();renderRoundSelect();
    go(view==="edit"?"tables":view);
  }catch(e){
    toast("Echec du chargement : "+e.message);
  }
  setBusy(false);
}

/* ---------- evenements ---------- */
document.getElementById("q").addEventListener("input",function(){
  if(view!=="scout") go("scout"); else renderScout();});
document.getElementById("clearQ").addEventListener("click",function(){
  document.getElementById("q").value="";renderScout();document.getElementById("q").focus();});
document.getElementById("bSync").addEventListener("click",doSync);
document.getElementById("rSel").addEventListener("change",async function(){
  var num=parseInt(this.value,10);
  db.cur=num;save();
  var r=curRound();
  if(r&&!r.tables){
    if(busy) return;
    setBusy(true);
    try{ await syncRound(r); save(); toast("Ronde "+r.num+" chargee"); }
    catch(e){ toast("Echec : "+e.message); }
    setBusy(false);
  }
  refresh();renderRoundSelect();
  go(view==="edit"?"tables":view);
});
document.getElementById("bNext").addEventListener("click",function(){
  var t=firstEmpty();
  if(!t) toast("Toutes les tables sont encodees");
  else openTable(t.t);
});
document.getElementById("eSave").addEventListener("click",function(){
  if(!draft) return;
  saveDraft();toast("Enregistre");go("tables");});
document.getElementById("eNextSave").addEventListener("click",function(){
  if(!draft) return;
  saveDraft();
  var n=firstEmpty();
  if(!n){toast("Toutes les tables sont encodees");go("tables");return;}
  openTable(n.t);
});
document.getElementById("eCancel").addEventListener("click",function(){draft=null;go("tables");});
document.getElementById("eClear").addEventListener("click",function(){
  if(!draft) return;
  draft.d=[[],[]];draft.o=[null,null];
  delete db.obs[obsKey(draft.num,draft.t)];
  save();refresh();paintSlots();paintOwners();toast("Table effacee");
});
document.getElementById("bLoadEv").addEventListener("click",async function(){
  var v=document.getElementById("evId").value.trim();
  if(!/^[0-9]+$/.test(v)){toast("Numero invalide");return;}
  if(v!==db.ev){
    if(!confirm("Changer de tournoi ? Tes observations restent en memoire mais ne correspondront plus aux tables.")) return;
    db.ev=v;db.rounds=[];db.cur=null;db.regs=[];save();
  }
  await doSync();
  go("tables");
});
document.getElementById("doExport").addEventListener("click",function(){
  var t=JSON.stringify(db);
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(function(){toast("Copie");},function(){prompt("Copie :",t);});
  else prompt("Copie :",t);
});
document.getElementById("doImport").addEventListener("click",function(){
  var t=prompt("Colle ta sauvegarde :");
  if(!t) return;
  try{
    var p=JSON.parse(t);
    if(!p.obs) throw 0;
    db=p;db.rounds=db.rounds||[];db.regs=db.regs||[];
    save();refresh();renderRoundSelect();go("scout");toast("Restaure");
  }catch(e){toast("Sauvegarde illisible");}
});
document.getElementById("doReset").addEventListener("click",function(){
  var n=Object.keys(db.obs).length;
  if(!confirm("Effacer les "+n+" tables encodees ? Les appariements restent.")) return;
  db.obs={};save();refresh();go("scout");toast("Observations effacees");
});

document.addEventListener("click",function(e){
  var ink=e.target.closest("[data-ink]");
  if(ink&&draft){
    var s=+ink.dataset.slot,k=ink.dataset.ink,a=draft.d[s],i=a.indexOf(k);
    if(i>=0) a.splice(i,1);
    else if(a.length>=2) toast("Deux encres maximum par deck");
    else a.push(k);
    paintSlots();paintOwners();
    return;
  }
  var ow=e.target.closest("[data-own]");
  if(ow&&draft){
    var s2=+ow.dataset.own;
    draft.o[s2]=draft.o[s2]?null:(s2===0?"p1":"p2");
    if(draft.o[0]&&draft.o[1]&&draft.o[0]===draft.o[1]) draft.o[1-s2]=null;
    paintOwners();
    return;
  }
  var tr=e.target.closest("[data-t]");
  if(tr){openTable(parseInt(tr.dataset.t,10));return;}
  var pr=e.target.closest("[data-player]");
  if(pr){document.getElementById("q").value=pr.dataset.player;go("scout");return;}
  var st=e.target.closest("[data-star]");
  if(st){
    var nm=st.dataset.star;
    db.ami=(norm(db.ami)===norm(nm))?"":nm;
    save();renderScout();
    toast(db.ami?("Tu suis "+nm):"Suivi retire");
    return;
  }
  var pf=e.target.closest("[data-pf]");
  if(pf){pFilter=pf.dataset.pf||null;renderPlayers();return;}
  var tf=e.target.closest("[data-tf]");
  if(tf){tFilter=tf.dataset.tf||null;renderTables();return;}
  var nb=e.target.closest("nav button");
  if(nb){go(nb.dataset.go);return;}
});

load();refresh();renderRoundSelect();go("scout");
if("serviceWorker" in navigator)
  window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){});});
})();
</script>
</body>
